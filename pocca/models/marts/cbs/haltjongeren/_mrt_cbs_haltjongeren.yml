version: 2

models:
  - name: mrt_cbs_haltjongeren
    description: "{{ doc('tbl_mrt_haltjongeren') }}" 
    config: 
      materialized: table
      tags: ['marts', 'reporting', 'semantic']

    columns:
      - name: id
        description: "{{ doc('dim_id') }}" 
        tests: 
        - not_null
        - unique

      - name: jaar
        description: "{{ doc('dim_jaar') }}"
        tests:
          - not_null

      - name: delictgroep
        description: "{{ doc('dim_delictgroep') }}"
        tests:
          - not_null

      - name: geslacht
        description: "{{ doc('dim_geslacht') }}"
        tests:
          - not_null

      - name: leeftijd
        description: "{{ doc('dim_leeftijd') }}"
        tests:
          - not_null

      - name: leeftijd_int
        description: "{{ doc('dim_leeftijd') }}"

      - name: leeftijd_groep
        description: "{{ doc('dim_leeftijd_groep') }}"
        tests:
          - not_null

      - name: opleiding
        description: "{{ doc('dim_opleiding') }}"
        tests:
          - not_null

      - name: type_delict
        description: "{{ doc('dim_type_delict') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['overtreding', 'misdrijf', 'overig']

      - name: haltjongeren
        description: "{{ doc('tpc_haltjongeren') }}"

      - name: haltjongeren_relatief
        description: "{{ doc('tpc_haltjongeren_relatief') }}"