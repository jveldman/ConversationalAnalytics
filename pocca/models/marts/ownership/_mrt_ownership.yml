version: 2 

models: 
  - name: mrt_ownership
    description: "{{ doc('tbl_stg_ownership') }}"
    columns: 
      - name: model_name
        description: "{{ doc('dim_model_name') }}"
        tests: 
          - not_null
          - unique
      
      - name: model_type
        description: "{{ doc('dim_model_type') }}"
        tests: 
          - not_null

      - name: data_owner
        description: "{{ doc('dim_data_owner') }}"
        tests: 
          - not_null  

      - name: data_steward
        description: "{{ doc('dim_data_steward') }}"
        tests: 
          - not_null    

      - name: data_steward_email
        description: "{{ doc('dim_data_steward_email') }}"
        tests: 
          - not_null