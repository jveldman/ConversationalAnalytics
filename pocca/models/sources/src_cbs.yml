version: 2

sources: 
  - name: raw_cbs
    database: "{{target.database}}"
    schema: raw
    description: "Rauwe CBS data. Bevat zowel data tabellen als metadata voor elke CBS tabel. Alle tabellen worden geladen vanuit de CBS Statline API via de cbsodata Python library."

    loader: Python (cbsodata)

    tables:
      - name: cbs_data_haltjongeren
        description: |
          CBS data on youth who have come into contact with Halt.
          Contains absolute counts and relative rates (per 10,000 inhabitants) of youth referred to Halt.
          Data available from 2005 onwards. Identifier: 85993NED.

      - name: cbs_info_haltjongeren
        description: "Table information for cbs_data_haltjongeren"

      - name: cbs_meta_haltjongeren
        description: "Column metadata for cbs_data_haltjongeren"

      - name: cbs_data_veelplegers
        description: "CBS data on repeat offenders (veelplegers)"

      - name: cbs_info_veelplegers
        description: "Table information for cbs_data_veelplegers"

      - name: cbs_meta_veelplegers
        description: "Column metadata for cbs_data_veelplegers"

      - name: cbs_data_verdachten
        description: "CBS data on suspects (verdachten)"
        catalog_url: "dataderden.cbs.nl"

      - name: cbs_info_verdachten
        description: "Table information for cbs_data_verdachten"
        catalog_url: "dataderden.cbs.nl"

      - name: cbs_meta_verdachten
        description: "Column metadata for cbs_data_verdachten"
        catalog_url: "dataderden.cbs.nl"