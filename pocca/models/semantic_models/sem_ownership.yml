time_spines:
  - name: time_spine
    model: ref('metricflow_time_spine')
    time_column: last_updated
    grains:
      - name: day
        column: date_day
      - name: week
        column: date_day
      - name: month
        column: date_day
      - name: quarter
        column: date_day
      - name: year
        column: date_day

semantic_models:
  - name: ownership
    description: "Metadata about the ownership of data. It includes the owners / producers of the data, as well as the stewards of the data."
    model: ref('mrt_ownership')
    defaults:
      agg_time_dimension: jaar
    
    entities:
      - name: ownership
        type: primary
        expr: model_name  # ← Primary key for ownership
        description: "Unique identifier for the dbt model"

    dimensions:
      - name: data_owner
        type: categorical
        expr: data_owner
      - name: data_steward
        type: categorical
        expr: data_steward
      - name: data_steward_email
        type: categorical
        expr: data_steward_email
      - name: model_type
        type: categorical
        expr: model_type