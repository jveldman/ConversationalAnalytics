name: Generate and Deploy dbt Docs

on:
  push:
    branches: [ main, general_readme_update ]
    paths:
      - 'pocca/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt
        run: pip install dbt-core dbt-duckdb

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          pocca:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: /tmp/warehouse.duckdb
                schema: pocca
          EOF

      - name: Build dbt models and generate docs
        run: |
          cd pocca
          dbt deps
          dbt docs generate --static
          cd ..

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pocca/target
          destination_dir: docs
          keep_files: false