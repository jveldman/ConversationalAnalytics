name: Generate and Deploy dbt Docs

on:
  push:
    branches: [ main, general_readme_update ]
    paths:
      - 'pocca/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install dbt-core dbt-duckdb
      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          pocca:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: /tmp/warehouse.duckdb
                schema: pocca
          EOF
      - name: Build dbt models and generate docs
        run: |
          cd pocca
          dbt deps
          dbt docs generate --static
          cd ..
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pocca/target

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4