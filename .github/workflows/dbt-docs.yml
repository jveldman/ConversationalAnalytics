name: Generate and Deploy dbt Docs

on:
  push:
    branches: [ main, general_readme_update ]
    paths:
      - 'pocca/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt (duckdb)
        run: pip install dbt-core dbt-duckdb

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          pocca:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: /tmp/warehouse.duckdb
                schema: pocca
          EOF

      - name: Install dbt packages
        working-directory: ./pocca
        run: dbt deps --profiles-dir ~/.dbt

      - name: Seed data
        working-directory: ./pocca
        run: dbt seed --profiles-dir ~/.dbt

      - name: Build dbt models
        working-directory: ./pocca
        run: dbt run --profiles-dir ~/.dbt

      - name: Generate dbt docs
        working-directory: ./pocca
        run: dbt docs generate --static --profiles-dir ~/.dbt

      - name: List target directory
        run: ls -R ./pocca/target

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pocca/target

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4